<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <h1>tính lương</h1>
    <input
      id="salary"
      type="number"
      value="100000"
      placeholder="lương một ngày"
    />
    <input id="daysWorked" type="number" value="" placeholder="só ngày làm" />
    <button id="tinhluong">Tính lương</button>
    <p id="SalaryRD"></p>

    <h1>tính giá trị trung bình</h1>
    <input id="input1" type="number" value="" placeholder="nhập số thứ 1" />
    <input id="input2" type="number" value="" placeholder="nhập số thứ 2" />
    <input id="input3" type="number" value="" placeholder="nhập số thứ 3" />
    <input id="input4" type="number" value="" placeholder="nhập số thứ 4" />
    <input id="input5" type="number" value="" placeholder="nhập số thứ 5" />
    <button id="avgbtn">tính trung bình</button>
    <p id="AvgRD"></p>

    <h1>quy đổi tiền</h1>
    <input
      id="usdinput"
      type="number"
      value=""
      placeholder="số usd muốn quy đổi"
    />
    <button id="converterbtn">quy đổi</button>
    <p id="MCD"></p>

    <h1>tính diện tích chu vi</h1>
    <input id="lenght" type="number" value="" placeholder="chiều dài" />
    <input id="width" type="number" value="" placeholder="chiều rộng" />
    <button id="PnAbtn">tính chu vi và diện tích</button>
    <p id="PnAResultDisplay"></p>

    <h1>tổng 2 số trong của 1 số có 2 chữ số</h1>
    <input id="2ln" type="number" value="" placeholder="số có 2 chữ số" />
    <button id="Sum">tổng</button>
    <p id="resultDisplay"></p>

    <script src="./index.js"></script>
  </body>
</html>
